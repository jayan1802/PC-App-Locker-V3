name: Build PC App Locker V4.2 TEST for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name PCAppLockerV4_2_TEST app_locker_v4.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCAppLockerV4_2_TEST_1-Windows
          path: dist/PCAppLockerV4_2_TEST.exe
          if-no-files-found: error
          retention-days: 30
