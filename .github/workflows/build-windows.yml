name: Build PC App Locker V3 for Windows
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PCAppLockerV3 --collect-all customtkinter --hidden-import=pystray app_locker_v3.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCAppLockerV3-Windows
          path: dist/PCAppLockerV3.exe
          if-no-files-found: error
          retention-days: 30
